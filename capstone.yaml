version: 1
project:
  name: Flyrank.WidgetPlatform.Api
  description: .NET 11 API for embeddable widgets and lead capture

run:
  command: dotnet run --project Flyrank.WidgetPlatform.Api/Flyrank.WidgetPlatform.Api.csproj --launch-profile http
  base_url: http://localhost:5273

seed:
  description: Create a sample widget in the running in-memory API. The response contains its generated widget ID.
  command: >-
    curl.exe -sS -X POST http://localhost:5273/api/widgets
    -H "Content-Type: application/json"
    --data-binary "{\"tenantId\":\"11111111-1111-4111-8111-111111111111\",\"name\":\"Capstone demo\",\"type\":\"lead-capture\",\"title\":\"Contact us\",\"buttonText\":\"Send\"}"

test_site:
  command: python -m http.server 8000 --directory test-site
  base_url: http://localhost:8000

evaluation:
  routes:
    - method: GET
      path: /api/widgets?tenantId={tenantId}
      expected_status: 200
    - method: POST
      path: /api/widgets
      expected_status: 201
    - method: GET
      path: /api/widgets/{id}?tenantId={tenantId}
      expected_status: 200
    - method: PUT
      path: /api/widgets/{id}
      expected_status: 200
    - method: DELETE
      path: /api/widgets/{id}?tenantId={tenantId}
      expected_status: 204
    - method: GET
      path: /api/widgets/{id}/configuration
      expected_status: 200
    - method: GET
      path: /api/widgets/{id}/loader.js
      expected_status: 200
    - method: GET
      path: /api/widgets/{id}/embed
      expected_status: 200
    - method: POST
      path: /api/submissions
      expected_status: 202
    - method: GET
      path: /api/dashboard/widgets/{widgetId}?tenantId={tenantId}
      expected_status: 200
